<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGMT - Offices - ITC Maintenance System</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/green.css">
<link rel="stylesheet" href="css/kit.css">
<script src="js/theme.js"></script>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- Theme before first paint (?theme=dark|light, else the saved choice), so an
     import or a direct link never flashes the wrong palette.
     Defaults to light (no auto-OS-dark). -->
<script>(function(){try{var tm=/[?&]theme=(dark|light)\b/.exec(location.search);var t=tm?tm[1]:(localStorage.getItem("itc_theme")||"light");if(t!=="dark")t="light";document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;}catch(e){}})();</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1E3A5F">
<script>(function(){var P="mgmt",R="management",F="offices.html";var OWN={requester:"or",technician:"itc",coordinator:"ic",management:"mgmt"};var ALLOW=["mgmt"];try{var tm=/[?&]theme=(dark|light)\b/.exec(location.search);var t=tm?tm[1]:(localStorage.getItem("itc_theme")||"light");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");else document.documentElement.setAttribute("data-theme","light");}catch(e){}var d=null;try{d=JSON.parse(localStorage.getItem("itc_db_v3"));}catch(e){}var a=d&&d.auth&&d.auth.role;if(a&&a!==R){var o=OWN[a]||"or";location.replace((ALLOW.indexOf(o)>-1?o:"or")+"-"+F);return;}window.ITC_URL_ROLE=P;})();</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="chromeSide"></aside>
  <div class="main">
    <header class="appbar" id="chromeAppbar"></header>
    <header class="topbar" id="chromeTopbar"></header>

    <main class="content">
      <div class="sec-title">
        <h2>Office directory</h2>
        <span class="hint">Every office served  --  services stay linked to their office</span>
      </div>

      <div class="card">
        <div class="filters">
          <div class="field"><label for="oQ">Search</label>
            <input type="search" id="oQ" placeholder="Name, code or contact…"></div>
          <div class="field"><label for="oActive">State</label>
            <select id="oActive"><option value="">All</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
          <div class="field filter-action">
            <button class="btn btn-primary" id="btnNewOffice">New office</button></div>
        </div>
      </div>

      <section class="grid grid-kpi mt" id="oKpi"></section>

      <div class="card mt">
        <div class="card-head"><h3>Offices</h3><span class="chip" id="oCount"> -- </span>
          <span class="hint">open / total service records</span></div>
        <table class="table">
          <thead><tr><th>Office</th><th>Contact</th><th>Services</th><th>State</th><th>Actions</th></tr></thead>
          <tbody id="oBody"></tbody>
        </table>
        <div class="empty" id="oEmpty" hidden><img src="img/empty-tickets.svg" alt="" width="120" height="90" loading="lazy">No offices match these filters.</div>
      </div>
    </main>

    <nav class="bottomnav" id="chromeBottom"></nav>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/flow.js"></script>
<script src="js/api.js"></script>
<script src="js/permissions.js"></script>
<script src="js/time.js"></script>
<script src="js/ui.js"></script>
<script src="js/query.js"></script>
<script src="js/live.js"></script>
<script>
UI.mountChrome({ title: 'Office directory', sub: 'Maintain the offices the IT service supports' });

var O_F = { q: '', active: '' };

function offices() {
  var db = Store.db;
  var byName = {};
  (db.offices || []).forEach(function (o) { byName[o.name] = o; });
  /* offices referenced by records but missing from the directory still show */
  (db.tickets || []).forEach(function (t) { if (t.office && !byName[t.office]) byName[t.office] = { name: t.office, active: true, _implicit: true }; });
  return Object.keys(byName).map(function (k) { return byName[k]; });
}

function stats(name) {
  var db = Store.db, all = db.tickets.filter(function (t) { return t.office === name; });
  var open = all.filter(function (t) { return Query.OPEN_STATES.indexOf(t.status) > -1; }).length;
  var jobs = db.jobs.filter(function (j) { return j.office === name; });
  var scheds = db.schedules.filter(function (s) { return s.office === name; });
  return { total: all.length, open: open, overdue: all.filter(function (t) { return Query.isOverdue(t); }).length,
    jobs: jobs.length, jobsOpen: jobs.filter(function (j) { return j.status !== 'closed'; }).length, scheds: scheds.length };
}

function render() {
  var rows = offices().filter(function (o) {
    if (O_F.active === 'active' && o.active === false) return false;
    if (O_F.active === 'inactive' && o.active !== false) return false;
    if (O_F.q) {
      var hay = [o.name, o.code, o.location, o.contactPerson, o.contactEmail].join(' ').toLowerCase();
      if (hay.indexOf(O_F.q.toLowerCase()) === -1) return false;
    }
    return true;
  });

  var active = offices().filter(function (o) { return o.active !== false; }).length;
  var total = 0, openAll = 0, overdueAll = 0;
  offices().forEach(function (o) { var s = stats(o.name); total += s.total; openAll += s.open; overdueAll += s.overdue; });
  document.getElementById('oKpi').innerHTML =
    kpi('Offices', offices().length, active + ' active', 'k-brand', UI.icon('building')) +
    kpi('Service records', total, 'linked to their office', 'k-ok', UI.icon('ticket')) +
    kpi('Still active', openAll, 'submitted → resolved', 'k-hold', UI.icon('hourglass')) +
    kpi('Overdue', overdueAll, 'past due point', 'k-warn', UI.icon('clock'));
  function kpi(l, v, d, c, dot) {
    return '<div class="card kpi ' + c + '"><div class="dot">' + dot + '</div><div class="label">' + l +
      '</div><div class="value">' + v + '</div><div class="delta">' + d + '</div></div>';
  }

  document.getElementById('oCount').textContent = rows.length + ' of ' + offices().length;
  document.getElementById('oEmpty').hidden = rows.length > 0;

  document.getElementById('oBody').innerHTML = rows.map(function (o, i) {
    var s = stats(o.name), off = o.active === false;
    return '<tr style="--row-index:' + i + '">' +
      '<td data-label="Office"><div class="t-title">' + UI.esc(o.name) + '</div>' +
      '<div class="t-sub mono">' + UI.esc(o.code || ' -- ') + ' · ' + UI.esc(o.location || '') + '</div></td>' +
      '<td data-label="Contact"><div class="t-title">' + UI.esc(o.contactPerson || ' -- ') + '</div>' +
      '<div class="t-sub">' + UI.esc(o.contactEmail || '') + (o.contactPhone ? ' · ' + UI.esc(o.contactPhone) : '') + '</div></td>' +
      '<td data-label="Services"><div class="t-title">' + s.open + ' open / ' + s.total + ' total</div>' +
      '<div class="t-sub">' + s.scheds + ' schedule(s) · ' + s.jobsOpen + ' open job(s)' + (s.overdue ? ' · ' + s.overdue + ' overdue' : '') + '</div></td>' +
      '<td data-label="State"><span class="badge ' + (off ? 'b-cancelled' : 'b-resolved') + '">' + (off ? 'Inactive' : 'Active') + '</span></td>' +
      '<td data-label="Actions"><div class="chip-row">' +
      '<button class="btn btn-ghost btn-sm" data-oedit="' + UI.attr(o.name) + '">Edit</button>' +
      '<button class="btn ' + (off ? 'btn-soft' : 'btn-danger-soft') + ' btn-sm" data-otoggle="' + UI.attr(o.name) + '" data-on="' + (off ? '1' : '0') + '">' + (off ? 'Activate' : 'Deactivate') + '</button>' +
      '<a class="btn btn-ghost btn-sm" href="tickets.html?office=' + encodeURIComponent(o.name) + '">Tickets</a>' +
      '</div></td></tr>';
  }).join('');

  document.querySelectorAll('[data-oedit]').forEach(function (b) { b.onclick = function () { editOffice(b.dataset.oedit); }; });
  document.querySelectorAll('[data-otoggle]').forEach(function (b) {
    b.onclick = function () {
      var r = window.Admin.setOfficeActive(b.dataset.otoggle, b.dataset.on === '1');
      UI.toast(r.msg, r.ok ? 'ok' : 'err');
    };
  });
}

function findOffice(name) {
  var hit = null;
  (Store.db.offices || []).forEach(function (o) { if (o.name === name) hit = o; });
  return hit;
}

function officeModal(o) {
  o = o || {};
  UI.openModal(o.name ? 'Edit office  --  ' + o.name : 'New office',
    '<div class="grid grid-form">' +
    UI.field('Office name', UI.input('name', 'e.g. College of Engineering', o.name || '', { required: true })) +
    UI.field('Code', UI.input('code', 'e.g. COE', o.code || '')) +
    UI.field('Location', UI.input('location', 'e.g. Engineering Bldg, Room 3', o.location || '')) +
    UI.field('Contact person', UI.input('contactPerson', 'e.g. Ms. Cruz', o.contactPerson || '')) +
    UI.field('Contact e-mail', UI.input('contactEmail', 'name@upcebu.edu.ph', o.contactEmail || '', { type: 'email' })) +
    UI.field('Contact phone', UI.input('contactPhone', '+63 917 …', o.contactPhone || '')) + '</div>' +
    (o.name ? '<p class="card-sub mt">Renaming an office carries its tickets, schedules and jobs across automatically.</p>' : ''),
    '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="mGo">' + (o.name ? 'Save office' : 'Create office') + '</button>');
  document.getElementById('mGo').onclick = function () {
    var r = window.Admin.saveOffice({
      id: o.name || '', name: UI.modalValue('name'), code: UI.modalValue('code'),
      location: UI.modalValue('location'), contactPerson: UI.modalValue('contactPerson'),
      contactEmail: UI.modalValue('contactEmail'), contactPhone: UI.modalValue('contactPhone')
    });
    UI.toast(r.msg, r.ok ? 'ok' : 'err');
    if (r.ok) UI.closeModal();
  };
}
function editOffice(name) { officeModal(findOffice(name) || { name: name }); }

document.getElementById('oQ').addEventListener('input', UI.debounce(function (e) { O_F.q = e.target.value; render(); }, 200));
document.getElementById('oActive').addEventListener('change', function (e) { O_F.active = e.target.value; render(); });
document.getElementById('btnNewOffice').addEventListener('click', function () { officeModal(null); });

Store.subscribe(render);
render();
Live.start();
</script>
<script src="js/pwa.js"></script>
</body>
</html>
