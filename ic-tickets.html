<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IC - Tickets - ITC Maintenance System</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/green.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/console.css">
<script src="js/theme.js"></script>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- Theme before first paint (?theme=dark|light, else the saved choice), so an
     import or a direct link never flashes the wrong palette.
     Defaults to light (no auto-OS-dark). -->
<script>(function(){try{var tm=/[?&]theme=(dark|light)\b/.exec(location.search);var t=tm?tm[1]:(localStorage.getItem("itc_theme")||"light");if(t!=="dark")t="light";document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;}catch(e){}})();</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1E3A5F">
<script>(function(){var P="ic",R="coordinator",F="tickets.html";var OWN={requester:"or",technician:"itc",coordinator:"ic",management:"mgmt"};var ALLOW=["or", "itc", "ic"];var HOME={"requester": "or-dashboard.html", "technician": "itc-dashboard.html", "coordinator": "ic-dashboard.html", "management": "mgmt-users.html"};try{var tm=/[?&]theme=(dark|light)\b/.exec(location.search);var t=tm?tm[1]:(localStorage.getItem("itc_theme")||"light");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");else document.documentElement.setAttribute("data-theme","light");}catch(e){}var d=null;try{d=JSON.parse(localStorage.getItem("itc_db_v3"));}catch(e){}var a=d&&d.auth&&d.auth.role;if(a&&a!==R){var o=OWN[a]||"or";location.replace(ALLOW.indexOf(o)>-1?(o+"-"+F):(HOME[a]||("or-"+F)));return;}window.ITC_URL_ROLE=P;})();</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="chromeSide"></aside>
  <div class="main">
    <header class="appbar" id="chromeAppbar"></header>
    <header class="topbar" id="chromeTopbar"></header>

    <main class="content">
      <div class="sec-title">
        <h2>Service tickets</h2>
        <span class="hint">Search, filter, sort and page through every request you are allowed to see</span>
      </div>

      <!-- quick chips + search -->
      <div class="card card-pad">
        <div class="row row-between">
          <div class="seg" id="tkChips"></div>
          <div class="row">
            <a class="btn btn-soft" id="tkNew" href="request.html">New request</a>
            <button class="btn btn-ghost" id="tkExport">Export CSV</button>
          </div>
        </div>
        <div class="row row-bottom mt">
          <label class="field-inline grow"><span>Search</span>
            <input type="search" id="tkQ" placeholder="Ticket id, issue, office, asset, technician…"></label>
          <label class="field-inline"><span>&nbsp;</span>
            <button class="btn btn-ghost" id="tkMore">Advanced filters</button></label>
        </div>

        <!-- advanced filters -->
        <div id="tkAdv" hidden class="divided">
          <div class="filters">
            <div class="field filter-office"><label for="fOffice">Office</label><select id="fOffice"><option value="">All offices</option></select></div>
            <div class="field"><label for="fStatus">Status</label><select id="fStatus"><option value="">All statuses</option></select></div>
            <div class="field lead-only"><label for="fPriority">Priority</label><select id="fPriority"><option value="">All priorities</option></select></div>
            <div class="field"><label for="fCategory">Category</label><select id="fCategory"><option value="">All categories</option></select></div>
            <div class="field filter-tech"><label for="fTech">Technician</label><select id="fTech"><option value="">All technicians</option></select></div>
            <div class="field"><label for="fSource">Source</label><select id="fSource"><option value="">All sources</option></select></div>
            <div class="field"><label for="fFrom">Created from</label><input type="date" id="fFrom"></div>
            <div class="field"><label for="fTo">Created to</label><input type="date" id="fTo"></div>
            <div class="field filter-scope"><label for="fMine">Scope</label>
              <select id="fMine"><option value="1">My office / my requests</option><option value="0">Whole register (authorized)</option></select></div>
            <div class="field"><label for="fOverdue">Overdue only</label>
              <select id="fOverdue"><option value="">No</option><option value="1">Yes</option></select></div>
            <div class="field"><label for="fSort">Sort by</label>
              <select id="fSort">
                <option value="updated">Last updated</option><option value="created">Created</option>
                <option value="status">Status</option><option value="priority">Priority</option>
                <option value="target">Target date</option><option value="id">Ticket id</option>
              </select></div>
            <div class="field"><label for="fOrder">Direction</label>
              <select id="fOrder"><option value="desc">Descending</option><option value="asc">Ascending</option></select></div>
            <div class="field filter-action"><button class="btn btn-ghost" id="fReset">Reset filters</button></div>
          </div>
        </div>
      </div>

      <!-- bulk bar -->
      <div class="card card-pad mt bulk-bar" id="tkBulk" hidden>
        <div class="row row-between">
          <b id="tkBulkCount">0 selected</b>
          <div class="row">
            <button class="btn btn-ghost" id="tkClearSel">Clear selection</button>
            <button class="btn btn-primary" id="tkBulkAssign">Bulk assign (≥1 selected)</button>
          </div>
        </div>
      </div>

      <!-- table / cards -->
      <div class="card mt">
        <div class="print-only" id="tkPrintHead"></div>
        <div class="card-head">
          <h3>Results</h3>
          <span class="chip" id="tkTotal">0</span>
          <span class="hint" id="tkScopeNote"></span>
          <div class="seg seg-view" id="tkView" role="group" aria-label="Result layout">
            <button type="button" data-view="list">List</button>
            <button type="button" data-view="cards">Cards</button>
            <button type="button" data-view="board" hidden>Board</button>
          </div>
          <details class="col-pick" id="tkCols">
            <summary>Columns</summary>
            <div class="col-pick-list" id="tkColsList"></div>
          </details>
          <button class="btn btn-ghost" id="tkPrint">Print list</button>
        </div>
        <table class="table" id="tkTable">
          <thead>
            <tr>
              <th class="col-check"><input type="checkbox" id="tkAll" aria-label="Select all"></th>
              <th data-sort-key="id" aria-sort="none"><button type="button" class="th-sort">Ticket<span class="th-mark" aria-hidden="true"></span></button></th>
              <th class="col-office">Office / requester</th>
              <th class="col-status" data-sort-key="status" aria-sort="none"><button type="button" class="th-sort">Status<span class="th-mark" aria-hidden="true"></span></button></th>
              <th class="lead-only col-priority" data-sort-key="priority" aria-sort="none"><button type="button" class="th-sort">Priority<span class="th-mark" aria-hidden="true"></span></button></th>
              <th class="col-target" data-sort-key="target" aria-sort="none"><button type="button" class="th-sort">Target<span class="th-mark" aria-hidden="true"></span></button></th>
              <th class="staff-only col-tech">Technician</th>
              <th class="col-updated" data-sort-key="updated" aria-sort="descending"><button type="button" class="th-sort">Last update<span class="th-mark" aria-hidden="true"></span></button></th>
            </tr>
          </thead>
          <tbody id="tkBody"></tbody>
        </table>
        <div class="wo-grid" id="tkCards" hidden></div>
        <div class="wo-board" id="tkBoard" hidden aria-label="Tickets grouped by status"></div>
        <p class="hint board-note" id="tkBoardNote" hidden></p>
        <div id="tkPagination"></div>
        <div class="empty" id="tkEmpty" hidden><img src="img/empty-tickets.svg" alt="" width="120" height="90" loading="lazy">No tickets match these filters.</div>
      </div>
    </main>

    <nav class="bottomnav" id="chromeBottom"></nav>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/flow.js"></script>
<script src="js/api.js"></script>
<script src="js/permissions.js"></script>
<script src="js/time.js"></script>
<script src="js/features.js"></script>
<script src="js/ui.js"></script>
<script src="js/query.js"></script>
<script src="js/actions.js"></script>
<script src="js/live.js"></script>
<script>
UI.mountChrome({ title: 'Service Tickets', sub: 'The ticket register: filter, sort, page and drill in' });

var PER_PAGE = 20;
var CHIPS = [
  ['open', 'Open'], ['mine', 'My tickets'], ['', 'All'], ['closed', 'Closed'],
  ['cancelled', 'Cancelled'], ['overdue', 'Overdue']
];
/* "Mine" means a different record for each lane: a requester owns the requests
   they raised, a technician owns the tickets assigned to them, and the other
   staff own the requests they raised. */
var F = {};           /* filter state forwarded to the query / API */
var chip = 'open';
var page = 1;
var selected = {};
var last = null;      /* last query envelope */
var lastScopeTotal = 0; /* the size of the register this role may see */
var VIEW_KEY = 'itc_ticket_view';
var BOARD = UI.feature('ticketsBoardView');
var view = 'list';
/* The picker offers the columns this register really draws. The selection box
   and the ticket column stay, and a column the map keeps from this lane is
   never offered, so the picker can only ever hide what the lane may see. */
var COLS = [['office', 'Office / requester'], ['status', 'Status'],
  ['priority', 'Priority'], ['target', 'Target'], ['tech', 'Technician'],
  ['updated', 'Last update']];
try {
  var savedView = localStorage.getItem(VIEW_KEY);
  if (savedView === 'cards' || savedView === 'list' || (BOARD && savedView === 'board')) view = savedView;
  else if (window.innerWidth < 600) view = 'cards';
} catch (e) {
  if (window.innerWidth < 600) view = 'cards';
}
/* The board is an optional extra. When its flag is off, the button and the
   column container leave the document, and a saved or linked board view
   falls back to the list or cards layout. */
if (!BOARD) {
  var boardBtn = document.querySelector('#tkView [data-view="board"]');
  if (boardBtn) boardBtn.remove();
  var boardHost = document.getElementById('tkBoard');
  if (boardHost) boardHost.remove();
  var boardNote = document.getElementById('tkBoardNote');
  if (boardNote) boardNote.remove();
} else {
  var boardShow = document.querySelector('#tkView [data-view="board"]');
  if (boardShow) boardShow.hidden = false;
}

/* Priority is an IT assessment: the office and technicians cannot filter or
   sort by a field they are not shown. */
if (UI.roleKey() === 'requester' || UI.roleKey() === 'technician') {
  var prioSort = document.querySelector('#fSort option[value="priority"]');
  if (prioSort) prioSort.remove();
}

/* ---------------------------- visible columns ---------------------------- */
function pickableCols() {
  var role = UI.roleKey();
  return COLS.filter(function (c) {
    if (c[0] === 'priority') return role !== 'requester' && role !== 'technician';
    if (c[0] === 'tech') return role !== 'requester';
    return true;
  });
}
var COLS_KEY = 'itc_ticket_cols_' + UI.roleKey();
var hiddenCols = (function () {
  var out = {};
  try {
    JSON.parse(localStorage.getItem(COLS_KEY) || '[]').forEach(function (k) { out[k] = 1; });
  } catch (e) { /* private mode or a value saved by another build */ }
  var allowed = {};
  pickableCols().forEach(function (c) { allowed[c[0]] = 1; });
  /* A name saved for another lane is dropped. The picker hides columns; it
     never reveals one the map keeps from this role. */
  Object.keys(out).forEach(function (k) { if (!allowed[k]) delete out[k]; });
  return out;
})();
function applyCols() {
  var table = document.getElementById('tkTable');
  COLS.forEach(function (c) { table.classList.toggle('hide-' + c[0], !!hiddenCols[c[0]]); });
}
function renderCols() {
  document.getElementById('tkColsList').innerHTML = pickableCols().map(function (c) {
    return '<label class="col-pick-item"><input type="checkbox" data-col="' + UI.attr(c[0]) + '"' +
      (hiddenCols[c[0]] ? '' : ' checked') + '>' + UI.esc(c[1]) + '</label>';
  }).join('');
}

/* ------------------------------- sorting ------------------------------- */
function sortState() {
  return { key: F.sort || 'updated', dir: (F.order || 'desc') === 'asc' ? 'asc' : 'desc' };
}
function renderSort() {
  var s = sortState();
  document.querySelectorAll('#tkTable th[data-sort-key]').forEach(function (th) {
    var on = th.dataset.sortKey === s.key;
    th.setAttribute('aria-sort', on ? (s.dir === 'asc' ? 'ascending' : 'descending') : 'none');
    var mark = th.querySelector('.th-mark');
    if (mark) mark.textContent = on ? (s.dir === 'asc' ? '▲' : '▼') : '';
  });
  /* The header and the Advanced filters must never disagree. */
  var sortSel = document.getElementById('fSort'), orderSel = document.getElementById('fOrder');
  if (sortSel && sortSel.querySelector('option[value="' + s.key + '"]')) sortSel.value = s.key;
  if (orderSel) orderSel.value = s.dir;
}

/* ------------------------------- printing ------------------------------- */
function filterSummary() {
  var s = sortState();
  var queues = { open: 'Open', mine: UI.roleKey() === 'technician' ? 'My tickets' : 'My requests',
    '': 'All', closed: 'Closed', cancelled: 'Cancelled', overdue: 'Overdue' };
  var bits = ['Queue: ' + (queues[chip] || chip)];
  if (F.q) bits.push('Search: ' + F.q);
  if (F.office) bits.push('Office: ' + F.office);
  if (F.status) bits.push('Status: ' + (UI.STATUS[F.status] ? UI.STATUS[F.status][0] : F.status));
  if (F.priority) bits.push('Priority: ' + F.priority);
  if (F.category) bits.push('Category: ' + F.category);
  if (F.tech) bits.push('Technician: ' + F.tech);
  if (F.source) bits.push('Source: ' + UI.sourceLabel(F.source));
  if (F.from) bits.push('From: ' + F.from);
  if (F.to) bits.push('To: ' + F.to);
  if (F.overdue === '1') bits.push('Overdue only');
  bits.push('Sorted by ' + (s.key === 'updated' ? 'last update' : s.key) + ', ' +
    (s.dir === 'asc' ? 'ascending' : 'descending'));
  return bits;
}
function buildPrintHead() {
  var host = document.getElementById('tkPrintHead');
  if (!host || !last) return;
  host.innerHTML =
    '<div class="print-head"><div class="print-brand">University of the Philippines Cebu</div>' +
    '<div class="print-sub">IT Service and Maintenance Management System</div>' +
    '<h1>Service tickets</h1></div>' +
    '<div class="print-meta">' + UI.esc(filterSummary().join(' | ')) +
    '<br>' + (last.total === lastScopeTotal
      ? 'All ' + last.total + ' ticket(s) in this register'
      : last.total + ' of ' + lastScopeTotal + ' ticket(s) in this register, page ' + last.page + ' of ' + last.pages) +
    ' | Printed ' + UI.esc(new Date().toLocaleString()) + '</div>';
}

function isLive() { return !!(window.ApiMode && window.Api && window.Api.tickets); }

/* ------------------------------- filters ------------------------------- */
function paramBag() {
  var p = {
    q: F.q || '', status: F.status || (chip === 'open' ? 'open' : chip === 'closed' ? 'closed'
      : chip === 'cancelled' ? 'cancelled' : ''),
    office: F.office || '', priority: F.priority || '', category: F.category || '',
    technician: F.tech || '', source: F.source || '',
    from: F.from || '', to: F.to || '', overdue: chip === 'overdue' ? '1' : (F.overdue || ''),
    sort: F.sort || 'updated', order: F.order || 'desc', page: page,
    size: BOARD && view === 'board' ? Query.MAX_SIZE : PER_PAGE
  };
  if (chip === 'open') p.status = 'open';
  /* scope: "mine" is personal and differs by role; All drops the personal
     scope, and a requester then reads the office register instead. */
  if (chip === 'mine') {
    if (UI.roleKey() === 'technician') p.technician = UI.viewerName();
    else p.mine = '1';
  } else if (UI.roleKey() === 'requester') {
    p.mine = chip === '' ? '0' : '1';
  } else if (F.mine === '1') p.mine = '1';
  else if (F.mine === '0') p.mine = '0';
  return p;
}

function fillFilters() {
  var db = Store.db, offices = {}, cats = {}, techs = {}, src = {}, prios = {};
  db.tickets.forEach(function (t) {
    offices[t.office] = 1; cats[t.category] = 1; src[t.source] = 1; prios[t.priority] = 1;
    if (t.technician) techs[t.technician] = 1;
  });
  (db.schedules || []).forEach(function (s) { if (s.technician) techs[s.technician] = 1; });
  fill('fOffice', 'All offices', Object.keys(offices).sort(), F.office);
  fill('fCategory', 'All categories', Object.keys(cats).sort(), F.category);
  fill('fTech', 'All technicians', Object.keys(techs).sort(), F.tech);
  fill('fSource', 'All sources', Object.keys(src).sort(), F.source, UI.sourceLabel);
  fill('fStatus', 'All statuses', Query.ALL_STATES, F.status, function (s) { return UI.STATUS[s] ? UI.STATUS[s][0] : s; });
  fill('fPriority', 'All priorities', ['low', 'medium', 'high', 'critical'], F.priority, function (p) {
    return p.charAt(0).toUpperCase() + p.slice(1);
  });
  function fill(id, all, arr, cur, lab) {
    var el = document.getElementById(id);
    if (el.dataset.filled === arr.length + ':' + all) { el.value = cur || ''; return; }
    el.dataset.filled = arr.length + ':' + all;
    el.innerHTML = '<option value="">' + all + '</option>' + arr.map(function (v) {
      return '<option value="' + UI.attr(v) + '">' + UI.esc(lab ? lab(v) : v) + '</option>';
    }).join('');
    el.value = cur || '';
  }
}

/* ------------------------------- chips ------------------------------- */
function renderChips() {
  CHIPS[1][1] = UI.roleKey() === 'technician' ? 'My tickets' : 'My requests';
  document.getElementById('tkChips').innerHTML = CHIPS.map(function (c) {
    return '<label class="' + (chip === c[0] ? 'on' : '') + '" data-chip="' + c[0] + '">' + c[1] + '</label>';
  }).join('');
}

/* ------------------------------- query ------------------------------- */
function runQuery() {
  var bag = paramBag();
  lastScopeTotal = Store.db.tickets.length;
  if (isLive()) {
    var env = Query.list(bag);
    if (env) return env;
    /* backend unreachable: degrade to the local mirror */
  }
  /* The demo dataset is not tenancy-scoped the way the server snapshot is, so
     mirror the same rules here: a requester sees the office register plus the
     requests they raised, a technician only the tickets assigned to them. */
  var pool = Store.db.tickets;
  var me = UI.viewerName();
  if (UI.roleKey() === 'requester') {
    var office = (Store.db.auth && Store.db.auth.office) ||
      (window.ROLES && window.ROLES[UI.roleKey()] ? window.ROLES[UI.roleKey()].office : '');
    pool = pool.filter(function (t) { return !office || t.office === office || t.requester === me; });
  } else if (UI.roleKey() === 'technician' && me) {
    pool = pool.filter(function (t) { return t.technician === me; });
  }
  lastScopeTotal = pool.length;
  var rows = Query.queryTickets(pool, bag, me);
  return {
    items: rows.items, total: rows.total, page: rows.page, pages: rows.pages,
    size: rows.size, counts: rows.counts, overdue: rows.overdue
  };
}

/* Updates this lane has not opened yet: the same read markers the bell uses,
   counted per record so the register can mark the subject without asking the
   reader to open it. */
function unreadFor(id) {
  var role = UI.roleKey();
  return (Store.db.notifications || []).filter(function (n) {
    return n.ticketId === id && (n.role === role || n.role === 'any') && !UI.notifRead(n);
  }).length;
}

function rowHTML(t, i) {
  var overdue = t.overdue === undefined ? Query.isOverdue(t) : t.overdue;
  var sel = selected[t.id] ? ' checked' : '';
  /* The register stays inside the reader's own lane, so the ticket number is a
     link to the lane copy of the record. */
  var href = UI.urlFor('ticket.html', UI.roleKey()) + '?id=' + encodeURIComponent(t.id);
  var cls = [];
  if (t.status === 'cancelled') cls.push('row-cancelled');
  /* An overdue row is tinted and carries the word, so the state never rests
     on the colour alone. */
  if (overdue) cls.push('row-overdue');
  var files = Array.isArray(t.attachments) ? t.attachments.length : 0;
  var replies = (Array.isArray(t.comments) ? t.comments : []).filter(function (c) {
    return UI.canSeeInternal() || c.visibility !== 'internal';
  }).length;
  var unread = unreadFor(t.id);
  var subject = String(t.issue);
  return '<tr data-href="' + UI.attr(href) + '" style="--row-index:' + i + '"' +
    (cls.length ? ' class="' + cls.join(' ') + '"' : '') + '>' +
    '<td data-label="Select" class="col-check tk-sel"><input type="checkbox" data-sel="' + UI.attr(t.id) + '"' + sel + ' aria-label="Select ' + UI.attr(t.id) + '"></td>' +
    '<td class="td-main" data-label="Ticket"><div class="t-id"><a class="t-link" href="' + UI.attr(href) + '">' + UI.esc(t.id) + '</a></div>' +
    '<div class="t-title' + (unread ? ' is-unread' : '') + '">' + UI.esc(subject.slice(0, 56)) + (subject.length > 56 ? '…' : '') + '</div>' +
    (files || replies || unread ? '<div class="t-marks">' +
      (files ? '<span class="t-mark" title="' + files + ' attachment(s)">' + UI.icon('paperclip') + files + '</span>' : '') +
      (replies ? '<span class="t-mark" title="' + replies + ' reply(ies)">' + UI.icon('message') + replies + '</span>' : '') +
      (unread ? '<span class="t-mark is-new">' + unread + ' unread</span>' : '') +
      '</div>' : '') +
    '<div class="t-sub">' + UI.esc(t.category) + (t.asset ? ' · Asset ' + UI.esc(t.asset) : '') +
    (t.linkedTo ? ' · linked ' + UI.esc(t.linkedTo) : '') + '</div></td>' +
    '<td class="col-office" data-label="Office"><div class="t-title">' + UI.esc(t.office) + '</div><div class="t-sub">' + UI.esc(t.requester) + '</div></td>' +
    '<td class="col-status" data-label="Status">' + UI.badge(t.status) + (overdue ? ' <span class="badge b-needs-info">Overdue</span>' : '') + UI.waitingOn(t.status) + '</td>' +
    '<td class="lead-only col-priority" data-label="Priority">' + UI.prio(t.priority) + '</td>' +
    '<td class="nowrap col-target" data-label="Target">' + (t.target ? UI.dateOnly(t.target) : (overdue ? 'past due' : 'Not set')) + '</td>' +
    '<td class="staff-only col-tech" data-label="Technician"><div class="t-title">' + UI.esc(t.technician || 'Unassigned') + '</div></td>' +
    '<td class="col-updated" data-label="Last update">' + UI.timeAgo(t.updatedAt || t.createdAt) + '</td></tr>';
}

function render() {
  fillFilters();
  renderChips();
  renderCols();
  applyCols();

  document.getElementById('tkNew').hidden = !UI.can('request.html');
  document.getElementById('tkNew').href = UI.urlFor('request.html', UI.roleKey());

  last = runQuery();
  renderSort();

  document.getElementById('tkTotal').textContent = last.total + ' of ' + lastScopeTotal;
  document.getElementById('tkScopeNote').textContent = UI.roleKey() === 'requester'
    ? 'Office tenancy applied. You see your office records and the requests you raised.'
    : 'the register you are authorized to view';
  document.getElementById('tkEmpty').hidden = last.total > 0;
  buildPrintHead();

  var cardHref = UI.urlFor('ticket.html', UI.roleKey()) + '?id=';
  document.getElementById('tkBody').innerHTML = last.items.map(rowHTML).join('');
  document.getElementById('tkCards').innerHTML = last.items.map(function (t) {
    return UI.workCard(t, { href: cardHref + encodeURIComponent(t.id) });
  }).join('');
  if (BOARD && view === 'board') renderBoard();
  applyView();

  document.querySelectorAll('#tkBody tr[data-href]').forEach(function (tr) {
    tr.addEventListener('click', function (e) {
      if (e.target && e.target.tagName === 'INPUT') return;
      location.href = tr.dataset.href;
    });
  });
  document.querySelectorAll('#tkBody [data-sel]').forEach(function (cb) {
    cb.addEventListener('change', function () {
      if (cb.checked) selected[cb.dataset.sel] = 1; else delete selected[cb.dataset.sel];
      renderBulk();
    });
  });

  var pg = { items: last.items, total: last.total, page: last.page, perPage: last.size, pages: last.pages };
  if (BOARD && view === 'board') document.getElementById('tkPagination').innerHTML = '';
  else UI.renderPagination(document.getElementById('tkPagination'), pg, function (p) { page = p; render(); });

  renderBulk();
}

/* The board groups the same filtered records into the six open workflow
   columns, with Closed and Cancelled kept in one collapsed archive lane. It
   loads up to the query cap in one pass, and each header count is the true
   total for that status, so a capped board still tells the whole story. */
var BOARD_STATES = ['submitted', 'needs_info', 'assigned', 'in_progress', 'on_hold', 'resolved'];
var ARCHIVE_STATES = ['closed', 'cancelled'];
var boardCapped = false;

/* Which guarded action records a move to the target state. The action opens
   the form that the workflow requires (for example a dependency reason for
   On Hold), so a board move can never skip a required field. */
function moveAction(t, next) {
  if (next === 'needs_info') return 'needsinfo';
  if (next === 'assigned') return t.reviewed ? 'assign' : 'reviewassign';
  if (next === 'submitted') return 'supplyinfo';
  if (next === 'in_progress') return t.status === 'on_hold' ? 'resolve' : t.status === 'resolved' ? 'reject' : 'start';
  if (next === 'on_hold') return 'hold';
  if (next === 'resolved') return 'pass';
  if (next === 'closed') return Store.db.role === 'requester' ? 'accept' : 'autoclose';
  if (next === 'cancelled') return t.status === 'on_hold' ? 'cannot' : 'cancel';
  return '';
}

function moveMenu(t) {
  if (!window.Flow || !Flow.canTransition) return '';
  var targets = Query.ALL_STATES.filter(function (s) { return Flow.canTransition(t.status, s); });
  if (!targets.length) return '<div class="wo-wait">Waiting on ' + UI.esc(UI.nextOwner(t.status).label) + '</div>';
  return '<details class="wo-move"><summary>' + UI.icon('arrowRight') + 'Move</summary>' +
    '<div class="wo-move-list">' + targets.map(function (s) {
      return '<button type="button" role="menuitem" data-move="' + UI.attr(s) + '" data-id="' + UI.attr(t.id) + '">' +
        UI.esc(UI.STATUS[s][0]) + '</button>';
    }).join('') + '</div></details>';
}

function boardCard(t) {
  return '<div class="wo-cell">' +
    UI.workCard(t, { href: UI.urlFor('ticket.html', UI.roleKey()) + '?id=' + encodeURIComponent(t.id) }) +
    moveMenu(t) + '</div>';
}

function renderBoard() {
  var counts = (last && last.counts) || {};
  var buckets = {};
  (last ? last.items : []).forEach(function (t) {
    (buckets[t.status] || (buckets[t.status] = [])).push(t);
  });
  var cols = BOARD_STATES.map(function (s) {
    var rows = buckets[s] || [];
    return '<section class="wo-col" data-board-status="' + UI.attr(s) + '" aria-label="' +
      UI.attr(UI.STATUS[s][0]) + '">' +
      '<header class="wo-col-head"><span class="wo-col-name">' + UI.esc(UI.STATUS[s][0]) + '</span>' +
      '<span class="wo-col-count">' + (counts[s] || 0) + '</span></header>' +
      '<div class="wo-col-body">' + (rows.length ? rows.map(boardCard).join('') : '<p class="wo-col-empty">No tickets</p>') + '</div></section>';
  });

  var archived = (buckets.closed || []).concat(buckets.cancelled || []);
  var archiveCount = (counts.closed || 0) + (counts.cancelled || 0);
  var open = chip === 'closed' || chip === 'cancelled' || ARCHIVE_STATES.indexOf(F.status) > -1;
  cols.push('<details class="wo-col wo-archive"' + (open ? ' open' : '') + ' data-board-status="archive">' +
    '<summary class="wo-col-head"><span class="wo-col-name">Archive: Closed and Cancelled</span>' +
    '<span class="wo-col-count">' + archiveCount + '</span></summary>' +
    '<div class="wo-col-body">' + (archived.length ? archived.map(boardCard).join('') : '<p class="wo-col-empty">No closed or cancelled tickets</p>') +
    '</div></details>');

  document.getElementById('tkBoard').innerHTML = cols.join('');

  var note = document.getElementById('tkBoardNote');
  var capped = last && last.total > last.items.length;
  boardCapped = !!capped;
  note.hidden = !capped;
  note.textContent = capped
    ? 'Showing the first ' + last.items.length + ' of ' + last.total + ' matching tickets. Narrow the filters to reach the rest.'
    : '';
}

/* A move is recorded through the same guarded action the ticket screen uses.
   The backend rejects the same move when called directly; here a refusal is
   shown as a toast and the card stays where it was. */
if (BOARD) document.getElementById('tkBoard').addEventListener('click', function (e) {
  var b = e.target.closest('[data-move]');
  if (!b) return;
  e.preventDefault();
  var t = Store.getTicket(b.dataset.id);
  if (!t) return;
  var a = moveAction(t, b.dataset.move);
  if (!a) { UI.toast('That move is not available from ' + UI.STATUS[t.status][0] + '.', 'err'); return; }
  if (window.Actions && Actions.act) Actions.act(a, t.id, function () { render(); });
});


function applyView() {
  if (view === 'board' && !BOARD) view = window.innerWidth < 600 ? 'cards' : 'list';
  var table = view === 'list';
  var cards = view === 'cards';
  var board = view === 'board';
  document.getElementById('tkTable').hidden = !table;
  document.getElementById('tkCards').hidden = !cards;
  /* Only the table has columns to pick. */
  document.getElementById('tkCols').hidden = !table;
  var boardHost = document.getElementById('tkBoard');
  if (boardHost) boardHost.hidden = !board;
  var boardNote = document.getElementById('tkBoardNote');
  if (boardNote) boardNote.hidden = !board || !boardCapped;
  document.querySelectorAll('#tkView [data-view]').forEach(function (b) {
    var on = b.dataset.view === view;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

function renderBulk() {
  var ids = Object.keys(selected);
  var bar = document.getElementById('tkBulk');
  bar.hidden = ids.length === 0 || view !== 'list';
  document.getElementById('tkBulkCount').textContent = ids.length + ' selected';
  /* bulk assign is a coordinator responsibility */
  document.getElementById('tkBulkAssign').hidden = UI.roleKey() !== 'coordinator';
}

/* ------------------------------- events ------------------------------- */
document.getElementById('tkQ').addEventListener('input', UI.debounce(function (e) {
  F.q = e.target.value; page = 1; render();
}, 240));
document.getElementById('tkMore').addEventListener('click', function () {
  var adv = document.getElementById('tkAdv');
  adv.hidden = !adv.hidden;
});
document.getElementById('tkView').addEventListener('click', function (e) {
  var b = e.target.closest('[data-view]');
  if (!b || b.dataset.view === view) return;
  if (b.dataset.view === 'board' && !BOARD) return;
  view = b.dataset.view;
  if (view === 'board') page = 1;
  try { localStorage.setItem(VIEW_KEY, view); } catch (err) { /* private mode */ }
  render();
});
/* A header click sorts by that column, and a second click on the same header
   turns the order around. The move stays inside the query the backend answers
   with, so the page and the register can never disagree. */
document.querySelectorAll('#tkTable th[data-sort-key]').forEach(function (th) {
  th.addEventListener('click', function () {
    var key = th.dataset.sortKey;
    if (Query.SORT_KEYS.indexOf(key) === -1) return;
    if (key === 'priority' && (UI.roleKey() === 'requester' || UI.roleKey() === 'technician')) return;
    var s = sortState();
    F.sort = key;
    F.order = s.key === key && s.dir === 'desc' ? 'asc' : 'desc';
    page = 1;
    render();
  });
});
document.getElementById('tkColsList').addEventListener('change', function (e) {
  var box = e.target.closest('[data-col]');
  if (!box) return;
  var key = box.dataset.col;
  var allowed = {};
  pickableCols().forEach(function (c) { allowed[c[0]] = 1; });
  if (!allowed[key]) return;
  if (box.checked) delete hiddenCols[key]; else hiddenCols[key] = 1;
  try { localStorage.setItem(COLS_KEY, JSON.stringify(Object.keys(hiddenCols))); } catch (err) { /* private mode */ }
  applyCols();
});
document.getElementById('tkPrint').addEventListener('click', function () {
  buildPrintHead();
  if (window.print) window.print();
  else UI.toast('This browser has no print dialog. Use the browser menu instead.', 'err');
});
document.getElementById('tkAll').addEventListener('change', function (e) {
  if (!last) return;
  last.items.forEach(function (t) { if (e.target.checked) selected[t.id] = 1; else delete selected[t.id]; });
  render();
});
document.getElementById('tkClearSel').addEventListener('click', function () { selected = {}; render(); });
/* The export mirrors the visible columns: the office never gets priority or
   the assigned technician, and a technician never gets priority. The internal
   cost stays off the office copy for the same reason. */
function exportHead(role) {
  role = role || UI.roleKey();
  var withPrio = role !== 'requester' && role !== 'technician';
  var withTech = role !== 'requester';
  var head = ['Ticket', 'Office', 'Requester', 'Status'];
  if (withPrio) head.push('Priority');
  head = head.concat(['Category', 'Target']);
  if (withTech) head.push('Technician');
  head = head.concat(['Created', 'Turnaround (h)']);
  if (role !== 'requester') head.push('Cost');
  return head;
}
document.getElementById('tkExport').addEventListener('click', function () {
  if (!last) return;
  var role = UI.roleKey();
  var withCost = role !== 'requester';
  var withPrio = role !== 'requester' && role !== 'technician';
  var withTech = role !== 'requester';
  var head = exportHead(role);
  var rows = [head];
  last.items.forEach(function (t) {
    var row = [t.id, t.office, t.requester, UI.STATUS[t.status] ? UI.STATUS[t.status][0] : t.status];
    if (withPrio) row.push(t.priority);
    row = row.concat([t.category, t.target ? UI.dateOnly(t.target) : '']);
    if (withTech) row.push(t.technician || '');
    row = row.concat([UI.dateOnly(t.createdAt), t.turnaroundHours == null ? '' : t.turnaroundHours]);
    if (withCost) row.push((t.diagnosis && t.diagnosis.cost) || 0);
    rows.push(row);
  });
  UI.downloadCSV('tickets.csv', rows);
});
document.getElementById('tkChips').addEventListener('click', function (e) {
  var l = e.target.closest('[data-chip]');
  if (!l) return;
  chip = l.dataset.chip; F.status = '';
  document.getElementById('fStatus').value = '';
  /* Keep the visible Scope control in step with the personal chips. */
  if (UI.roleKey() !== 'technician' && (chip === 'mine' || chip === '')) {
    F.mine = chip === 'mine' ? '1' : '0';
    var scopeSel = document.getElementById('fMine');
    if (scopeSel) scopeSel.value = F.mine;
  }
  page = 1; render();
});
['fOffice', 'fStatus', 'fPriority', 'fCategory', 'fTech', 'fSource', 'fFrom', 'fTo', 'fMine', 'fOverdue', 'fSort', 'fOrder'].forEach(function (id) {
  document.getElementById(id).addEventListener('change', function () { readFilters(); page = 1; render(); });
});
function readFilters() {
  F.office = document.getElementById('fOffice').value;
  F.status = document.getElementById('fStatus').value;
  F.priority = document.getElementById('fPriority').value;
  F.category = document.getElementById('fCategory').value;
  F.tech = document.getElementById('fTech').value;
  F.source = document.getElementById('fSource').value;
  F.from = document.getElementById('fFrom').value;
  F.to = document.getElementById('fTo').value;
  F.mine = document.getElementById('fMine').value;
  F.overdue = document.getElementById('fOverdue').value;
  F.sort = document.getElementById('fSort').value;
  F.order = document.getElementById('fOrder').value;
}
document.getElementById('fReset').addEventListener('click', function () {
  F = {}; chip = 'open'; page = 1;
  ['fOffice', 'fStatus', 'fPriority', 'fCategory', 'fTech', 'fSource', 'fFrom', 'fTo', 'fOverdue'].forEach(function (id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('fMine').value = UI.roleKey() === 'requester' ? '1' : '0';
  document.getElementById('fSort').value = 'updated';
  document.getElementById('fOrder').value = 'desc';
  document.getElementById('tkQ').value = '';
  render();
});

/* bulk assign (coordinator): a modal that assigns every selected ticket */
document.getElementById('tkBulkAssign').addEventListener('click', function () {
  var ids = Object.keys(selected);
  if (!ids.length) return;
  UI.openModal('Bulk assign ' + ids.length + ' ticket(s), status Assigned',
    UI.field('Technician', UI.select('tech', [['J. Tan', 'J. Tan (hardware / network)'], ['M. Uy', 'M. Uy (printers / UPS)'], ['K. Villanueva', 'K. Villanueva (systems)']], 'J. Tan', true)) +
    '<div class="note mt"><span>' + UI.icon('info') + '</span><div>Only tickets currently <b>Submitted</b> can be assigned; others are skipped and reported.</div></div>',
    '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="mGo">Assign selected</button>');
  document.getElementById('mGo').onclick = function () {
    var tech = UI.modalValue('tech'), done = 0, skipped = 0;
    UI.closeModal();
    ids.forEach(function (id) {
      var r = Flow.assign(id, tech);
      if (r && r.ok) done++; else skipped++;
    });
    UI.toast(done + ' assigned' + (skipped ? ', ' + skipped + ' skipped (wrong status)' : '') + '.', done ? 'ok' : 'err');
    selected = {};
    UI.renderBell();
    render();
  };
});

/* A search from the top bar, a queue from the sidebar, or a status chip on the
   dashboard opens the register already filtered. */
(function readUrlState() {
  var q = UI.qs('q');
  if (q) { F.q = q; document.getElementById('tkQ').value = q; }
  var queue = UI.qs('queue');
  if (['open', 'mine', 'closed', 'all', 'cancelled', 'overdue'].indexOf(queue) > -1) {
    chip = queue === 'all' ? '' : queue;
  }
  /* The Scope select is visible to the coordinator and the administrator; its
     default must match the query, which starts on the whole register. */
  if ((UI.roleKey() === 'coordinator' || UI.roleKey() === 'management') && chip !== 'mine') {
    F.mine = '0';
    document.getElementById('fMine').value = '0';
  }
  var status = UI.qs('status');
  if (Query.ALL_STATES.indexOf(status) > -1) { F.status = status; chip = ''; }
  var office = UI.qs('office');
  if (office) F.office = office;
  var v = UI.qs('view');
  if (v === 'cards' || v === 'list' || (BOARD && v === 'board')) view = v;
})();

Store.subscribe(render);
render();
Live.start();
</script>
<script src="js/pwa.js"></script>
</body>
