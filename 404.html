<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#014421">
<title>Page not found  --  ITC Maintenance System</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/green.css">
<link rel="stylesheet" href="/css/kit.css">
<script src="js/theme.js"></script>

<!-- Theme before first paint (?theme=dark|light, else the saved choice), so an
     import or a direct link never flashes the wrong palette.
     Defaults to light (no auto-OS-dark). -->
<script>(function(){try{var tm=/[?&]theme=(dark|light)\b/.exec(location.search);var t=tm?tm[1]:(localStorage.getItem("itc_theme")||"light");if(t!=="dark")t="light";document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;}catch(e){}})();</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1E3A5F">
</head>
<body>
<div class="nf">
  <div class="nf-card">
    <span class="brand-mark lg">MS</span>
    <div class="nf-code">404</div>
    <h1>We couldn’t find that page</h1>
    <p>The page you’re looking for doesn’t exist or may have moved. Check the address, or head back to the dashboard.</p>
    <div class="nf-actions">
      <a class="btn btn-primary" href="/">Back to sign in</a>
      <a class="btn btn-soft" href="/dashboard.html">Open dashboard</a>
    </div>
  </div>
</div>
<script src="js/pwa.js"></script>
</body>
</html>
