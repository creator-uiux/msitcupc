<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assets | ITC Maintenance System</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/green.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/console.css">
<script src="js/theme.js"></script>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- Theme before first paint (?theme=dark|light, else the saved choice), so an
     import or a direct link never flashes the wrong palette.
     Defaults to light (no auto-OS-dark). -->
<script>(function(){try{var tm=/[?&]theme=(dark|light)\b/.exec(location.search);var t=tm?tm[1]:(localStorage.getItem("itc_theme")||"light");if(t!=="dark")t="light";document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;}catch(e){}})();</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1E3A5F">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="chromeSide"></aside>
  <div class="main">
    <header class="appbar" id="chromeAppbar"></header>
    <header class="topbar" id="chromeTopbar"></header>

    <main class="content">
      <div class="sec-title">
        <h2>Asset register</h2>
        <span class="hint">Every unit the IT team keeps, with the office that holds it.</span>
      </div>

      <div class="card">
        <div class="filters">
          <div class="field"><label for="aQ">Search</label>
            <input type="search" id="aQ" placeholder="Number, name or location…"></div>
          <div class="field"><label for="aOffice">Office</label>
            <select id="aOffice"><option value="">All offices</option></select></div>
          <div class="field"><label for="aCategory">Category</label>
            <select id="aCategory"><option value="">All categories</option></select></div>
          <div class="field"><label for="aActive">State</label>
            <select id="aActive"><option value="">All</option><option value="active">In service</option><option value="inactive">Retired</option></select></div>
          <div class="field filter-action">
            <button class="btn btn-primary" id="btnNewAsset">New asset</button></div>
        </div>
      </div>

      <section class="grid grid-kpi mt" id="aKpi"></section>

      <div class="card mt">
        <div class="card-head"><h3>Registered units</h3><span class="chip" id="aCount">0</span>
          <span class="hint">the number a ticket or a plan types by hand</span></div>
        <table class="table">
          <thead><tr><th>Asset</th><th>Held by</th><th>Category</th><th>State</th><th>Actions</th></tr></thead>
          <tbody id="aBody"></tbody>
        </table>
        <div class="empty" id="aEmpty" hidden><img src="img/empty-tickets.svg" alt="" width="120" height="90" loading="lazy">No assets match these filters.</div>
        <div id="aPagination"></div>
      </div>
    </main>

    <nav class="bottomnav" id="chromeBottom"></nav>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/flow.js"></script>
<script src="js/api.js"></script>
<script src="js/permissions.js"></script>
<script src="js/time.js"></script>
<script src="js/features.js"></script>
<script src="js/ui.js"></script>
<script src="js/query.js"></script>
<script src="js/live.js"></script>
<script>
UI.mountChrome({ title: 'Asset register', sub: 'Keep the units, their numbers and where they live' });

var A_F = { q: UI.qs('q'), office: '', category: '', active: '' };
var aPage = 1;
const A_PER_PAGE = 12;

/* A command palette result opens the register already filtered. */
document.getElementById('aQ').value = A_F.q;

function assets() { return Store.db.assets || []; }
function categories() { return (Store.db.settings && Store.db.settings.categories) || []; }
function officeNames() {
  return (Store.db.offices || []).filter(function (o) { return o.active !== false; })
    .map(function (o) { return o.name; }).sort();
}

function fillFilters() {
  var pairs = function (list) {
    return list.map(function (v) { return '<option value="' + UI.attr(v) + '">' + UI.esc(v) + '</option>'; });
  };
  var off = document.getElementById('aOffice');
  var cat = document.getElementById('aCategory');
  if (off.dataset.built !== '1') {
    off.innerHTML = '<option value="">All offices</option>' + pairs(officeNames()).join('');
    cat.innerHTML = '<option value="">All categories</option>' + pairs(categories()).join('');
    off.dataset.built = '1';
  }
}

/* Register administration only.  The administrator lane holds no service
   records (role scope 5), so a unit is described by what it is and where it
   lives, never by the tickets or the visits that named it.  The service
   history of a unit stays on the Office Register, in the lanes that read them. */
function render() {
  fillFilters();
  var all = assets();
  var rows = all.filter(function (a) {
    if (A_F.office && a.office !== A_F.office) return false;
    if (A_F.category && a.category !== A_F.category) return false;
    if (A_F.active === 'active' && a.active === false) return false;
    if (A_F.active === 'inactive' && a.active !== false) return false;
    if (A_F.q) {
      var hay = [a.tag, a.name, a.location, a.office, a.category].join(' ').toLowerCase();
      if (hay.indexOf(A_F.q.toLowerCase()) === -1) return false;
    }
    return true;
  });

  function kpi(l, v, d, c, dot) {
    return '<div class="card kpi ' + c + '"><div class="dot">' + dot + '</div><div class="label">' + l +
      '</div><div class="value">' + v + '</div><div class="delta">' + d + '</div></div>';
  }
  var live = all.filter(function (a) { return a.active !== false; }).length;
  var held = {};
  all.forEach(function (a) { if (a.active !== false) held[a.office] = 1; });
  document.getElementById('aKpi').innerHTML =
    kpi('Units', all.length, live + ' in service', 'k-brand', UI.icon('case')) +
    kpi('In service', live, (all.length - live) + ' retired', 'k-ok', UI.icon('checkCircle')) +
    kpi('Retired', all.length - live, 'kept for the records that name them', 'k-hold', UI.icon('shield')) +
    kpi('Offices held', Object.keys(held).length, 'of ' + officeNames().length + ' served', 'k-warn', UI.icon('building'));

  document.getElementById('aCount').textContent = rows.length + ' of ' + all.length;
  document.getElementById('aEmpty').hidden = rows.length > 0;

  var pages = Math.max(1, Math.ceil(rows.length / A_PER_PAGE));
  if (aPage > pages) aPage = pages;
  var pg = UI.paginate(rows, aPage, A_PER_PAGE);

  document.getElementById('aBody').innerHTML = pg.items.map(function (a, i) {
    var off = a.active === false;
    return '<tr style="--row-index:' + i + '">' +
      '<td data-label="Asset"><div class="t-title mono">' + UI.esc(a.tag) + '</div>' +
      '<div class="t-sub">' + UI.esc(a.name || 'No name') + '</div></td>' +
      '<td data-label="Held by"><div class="t-title">' + UI.esc(a.office) + '</div>' +
      '<div class="t-sub">' + UI.esc(a.location || 'Location not set') + '</div></td>' +
      '<td data-label="Category">' + UI.esc(a.category || '') + '</td>' +
      '<td data-label="State"><span class="badge ' + (off ? 'b-cancelled' : 'b-resolved') + '">' +
      (off ? 'Retired' : 'In service') + '</span>' +
      '<div class="t-sub">' + UI.esc(a.id) + '</div></td>' +
      '<td data-label="Actions"><div class="chip-row">' +
      '<button class="btn btn-ghost btn-sm" data-aedit="' + UI.attr(a.id) + '">Edit</button>' +
      '<button class="btn ' + (off ? 'btn-soft' : 'btn-danger-soft') + ' btn-sm" data-atoggle="' + UI.attr(a.id) + '" data-on="' + (off ? '1' : '0') + '">' +
      (off ? 'Restore' : 'Retire') + '</button>' +
      '</div></td></tr>';
  }).join('');

  document.querySelectorAll('[data-aedit]').forEach(function (b) { b.onclick = function () { assetModal(findAsset(b.dataset.aedit)); }; });
  document.querySelectorAll('[data-atoggle]').forEach(function (b) {
    b.onclick = function () {
      var r = window.Admin.setAssetActive(b.dataset.atoggle, b.dataset.on === '1');
      UI.toast(r.msg, r.ok ? 'ok' : 'err');
    };
  });
  UI.renderPagination(document.getElementById('aPagination'), pg, function (p) { aPage = p; render(); });
}

function findAsset(id) {
  var hit = null;
  (Store.db.assets || []).forEach(function (a) { if (a.id === id) hit = a; });
  return hit;
}

function assetModal(a) {
  a = a || {};
  var opts = categories().map(function (c) { return [c, c]; });
  var offs = officeNames().map(function (o) { return [o, o]; });
  UI.openModal(a.tag ? 'Edit asset: ' + a.tag : 'New asset',
    '<div class="grid grid-form">' +
    UI.field('Asset number', UI.input('tag', 'e.g. PC-OF-118', a.tag || '', { required: true })) +
    UI.field('Description', UI.input('name', 'e.g. Dell OptiPlex 7090 SFF', a.name || '', { required: true })) +
    UI.field('Category', UI.select('category', opts, a.category, true)) +
    UI.field('Held by', UI.select('office', offs, a.office, true)) +
    UI.field('Location', UI.input('location', 'e.g. Admin Building, Room 105', a.location || '')) +
    '</div>' +
    '<p class="card-sub mt">The number is written the same way on a request and on a maintenance plan, ' +
    'so it is held to that shape and never reused, even after the unit is retired.</p>' +
    (a.tag ? '<p class="card-sub">Renaming an office carries its assets across automatically.</p>' : ''),
    '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="mGo">' +
    (a.tag ? 'Save asset' : 'Register asset') + '</button>');
  document.getElementById('mGo').onclick = function () {
    var r = window.Admin.saveAsset({
      id: a.id || '', tag: UI.modalValue('tag'), name: UI.modalValue('name'),
      category: UI.modalValue('category'), office: UI.modalValue('office'),
      location: UI.modalValue('location')
    });
    UI.toast(r.msg, r.ok ? 'ok' : 'err');
    if (r.ok) UI.closeModal();
  };
}

document.getElementById('aQ').addEventListener('input', UI.debounce(function (e) { A_F.q = e.target.value; aPage = 1; render(); }, 200));
document.getElementById('aOffice').addEventListener('change', function (e) { A_F.office = e.target.value; aPage = 1; render(); });
document.getElementById('aCategory').addEventListener('change', function (e) { A_F.category = e.target.value; aPage = 1; render(); });
document.getElementById('aActive').addEventListener('change', function (e) { A_F.active = e.target.value; aPage = 1; render(); });
document.getElementById('btnNewAsset').addEventListener('click', function () { assetModal(null); });

Store.subscribe(render);
render();
Live.start();
</script>
<script src="js/pwa.js"></script>
</body>
</html>
